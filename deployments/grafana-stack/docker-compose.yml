# RSBP — lightweight Grafana + Prometheus stack (no Elasticsearch).
# Reads the metrics the rsbpd daemon already exposes on 127.0.0.1:9090 and renders
# an operational "SOC view" to complement the per-alert console on :9001.
#
# Host networking is used so Prometheus can scrape the daemon's loopback metrics
# endpoint directly (Linux only — the demo VM is Linux). Prometheus serves its own
# UI on :9091 to avoid clashing with the daemon's metrics port (:9090).
#
#   cd deployments/grafana-stack && docker compose up -d
#   # then browse Grafana at http://localhost:3000  (anonymous, opens the RSBP board)
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: rsbp-prometheus
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=0.0.0.0:9091
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    container_name: rsbp-grafana
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      # Anonymous, read-only access so the board opens on the projector with no login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD: "rsbp-demo"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/rsbp.json"
      GF_USERS_DEFAULT_THEME: "dark"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
